<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Admin - Quản lý</title>
        <link rel="stylesheet" href="../css/style.css">
        <script src="../data/data.js"></script>
        <script defer src="../js/script.js"></script>
    </head>
    <body>
        <main>
            <div class="admin-container">
                <div class="admin-panel" id="schedulesPanel">
                    <div class="admin-header">
                        <div class="admin-title">Schedules</div>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <button id="reloadSchedules" class="modal-btn confirm">Reload</button>
                        </div>
                    </div>
                    <div class="table-wrap">
                        <table class="admin-table" id="schedulesTable">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Counter</th>
                                    <th>Processing</th>
                                    <th>Done</th>
                                    <th>Skip</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
                <div class="admin-panel" id="historyPanel">
                    <div class="admin-header">
                        <div class="admin-title">History</div>
                        <div class="filter-row">
                            <input type="date" id="historyDate" />
                            <button id="loadHistory" class="modal-btn confirm">Filter</button>
                        </div>
                    </div>
                    <div class="table-wrap">
                        <table class="admin-table" id="historyTable">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Done</th>
                                    <th>Skip</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
        <!-- Admin initialization moved to js/script.js -->
    </body>
</html>
